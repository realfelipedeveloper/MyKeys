name: ${MYKEYS_COMPOSE_PROJECT_NAME:-mykeys}

services:
  postgres:
    image: ${MYKEYS_POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MYKEYS_POSTGRES_DB:-mykeys}
      POSTGRES_USER: ${MYKEYS_POSTGRES_USER:-mykeys}
      POSTGRES_HOST_AUTH_METHOD: ${MYKEYS_POSTGRES_AUTH_METHOD:-trust}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${MYKEYS_POSTGRES_PORT:-43130}:5432"
    volumes:
      - mykeys_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mykeys_private
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: postgres

  redis:
    image: ${MYKEYS_REDIS_IMAGE:-redis:8.10-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:${MYKEYS_REDIS_PORT:-43140}:6379"
    volumes:
      - mykeys_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -h
        - 127.0.0.1
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mykeys_private
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: redis

  mailpit:
    image: ${MYKEYS_MAILPIT_IMAGE:-axllent/mailpit:v1.30.7}
    restart: unless-stopped
    user: "65534:65534"
    environment:
      MP_MAX_MESSAGES: ${MYKEYS_MAILPIT_MAX_MESSAGES:-500}
    ports:
      - "127.0.0.1:${MYKEYS_MAIL_SMTP_PORT:-43150}:1025"
      - "127.0.0.1:${MYKEYS_MAIL_UI_PORT:-43151}:8025"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8025/readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mykeys_private
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: mailpit

  minio:
    image: ${MYKEYS_MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:4c94e754559e9fb91cefe103a056d63582b5892de612b647d8e1b0751af5067e}
    restart: unless-stopped
    user: "65532:65532"
    command:
      - server
      - /data
      - --address
      - ":9000"
      - --console-address
      - ":9001"
    ports:
      - "127.0.0.1:${MYKEYS_MINIO_PORT:-43160}:9000"
      - "127.0.0.1:${MYKEYS_MINIO_CONSOLE_PORT:-43161}:9001"
    volumes:
      - mykeys_minio_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /minio/health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ "$$status" == *"200 OK"* ]]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mykeys_private
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: minio

networks:
  mykeys_private:
    name: ${MYKEYS_DOCKER_NETWORK:-mykeys_private}
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys

volumes:
  mykeys_postgres_data:
    name: ${MYKEYS_POSTGRES_DATA_VOLUME:-mykeys_postgres_data}
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: postgres
  mykeys_redis_data:
    name: ${MYKEYS_REDIS_DATA_VOLUME:-mykeys_redis_data}
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: redis
  mykeys_minio_data:
    name: ${MYKEYS_MINIO_DATA_VOLUME:-mykeys_minio_data}
    labels:
      io.github.realfelipedeveloper.project: mykeys
      io.github.realfelipedeveloper.namespace: mykeys
      io.github.realfelipedeveloper.service: minio
